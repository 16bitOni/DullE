name: Release

# Triggers on a pushed version tag: git tag v0.2.0 && git push --tags
on:
  push:
    tags:
      - "v*"

jobs:
  # ── 1. Publish to PyPI ────────────────────────────────────────
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Required for OIDC trusted publishing (no API token needed)

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Build wheel + sdist
        run: uv build

      - name: Publish to PyPI
        run: uv publish
        # Uses OIDC trusted publishing — set up at pypi.org/manage/project/dulle/settings/publishing/

