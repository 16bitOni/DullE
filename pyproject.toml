[project]
name = "dulle"
version = "0.1.0"
description = "Hybrid CLI + Vision Windows Computer Use Agent (multi-model)"
requires-python = ">=3.11"
dependencies = [
    # LLM client (single OpenAI-compatible endpoint for all models)
    "openai>=1.50.0",

    # Screen capture and image
    "mss>=9.0.0",
    "Pillow>=10.0.0",

    # Desktop automation
    "pyautogui>=0.9.54",
    "pynput>=1.7.6",
    "pyperclip>=1.8.0",

    # Utilities
    "structlog>=24.0.0",
    "pydantic-settings>=2.0.0",
    "loguru>=0.7.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
dulle = "dulle.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dulle"]
