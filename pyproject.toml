[project]
name = "dulle"
version = "0.1.0"
description = "Hybrid CLI + Vision Windows desktop automation agent"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "16bitoni" }
]
keywords = ["windows", "automation", "computer-use", "agent", "llm", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # LLM client (single OpenAI-compatible endpoint for all models)
    "openai>=1.50.0",

    # Screen capture and image
    "mss>=9.0.0",
    "Pillow>=10.0.0",

    # Desktop automation
    "pyautogui>=0.9.54",
    "pynput>=1.7.6",
    "pyperclip>=1.8.0",

    # Utilities
    "structlog>=24.0.0",
    "pydantic-settings>=2.0.0",
    "loguru>=0.7.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/16bitoni/DullE"
Repository = "https://github.com/16bitoni/DullE"
Issues = "https://github.com/16bitoni/DullE/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
dulle = "dulle.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dulle"]
