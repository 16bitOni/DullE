# ─────────────────────────────────────────────────────────────
# DullE — Personal Knowledge Base
# ─────────────────────────────────────────────────────────────
#
# Add facts about YOUR setup here. The agent reads this file
# before every task and uses relevant entries to make better
# decisions.
#
# Each entry has:
#   fact:     The actual knowledge (what the agent should know)
#   tags:     Keywords for matching — the agent finds entries by
#             comparing these against your command text
#   app:      (optional) Which app this relates to
#   context:  (optional) Extra detail about when/why this matters
#
# The agent only pulls in entries that match your current task,
# so feel free to add as many as you want — it won't slow down
# unrelated tasks.
# ─────────────────────────────────────────────────────────────

